name: update
# Follows the latest release of cratestack/corntchap. render: rewrite Formula/corntchap-cli.rb from the release's
# digests and .sha256 files. test: install the rendered file on real runners. publish: push it, only
# if the test passed. Nothing reaches the default branch before it has been installed.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z). Empty: the latest release."
        required: false
        type: string
permissions:
  contents: read
# two runs must not race on the same push
concurrency:
  group: update-formula
  cancel-in-progress: false
jobs:
  render:
    # the workflow file runs from the branch it was dispatched on: only the default branch may publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: fetch the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }} # untrusted: only ever read from the environment, validated below
        run: |
          set -euo pipefail
          # "release not found" is also what a missing or private repo answers: assert the source first
          vis=$(gh repo view cratestack/corntchap --json visibility --jq .visibility) \
            || { echo "::error::cannot read cratestack/corntchap"; exit 1; }
          [ "$vis" = PUBLIC ] || { echo "::error::cratestack/corntchap is $vis, expected PUBLIC"; exit 1; }
          args=()
          if [ -n "$INPUT_TAG" ]; then
            [[ $INPUT_TAG =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo "::error::tag input is not vMAJOR.MINOR.PATCH"; exit 1; }
            args=("$INPUT_TAG")
          fi
          if ! gh release view "${args[@]}" --repo cratestack/corntchap --json tagName,assets,isImmutable > release.json 2> err.txt; then
            if [ -z "$INPUT_TAG" ] && grep -qi 'release not found' err.txt; then
              echo "No release of cratestack/corntchap yet; nothing to do."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat err.txt >&2
            exit 1
          fi
          tag=$(jq -er '.tagName' release.json)
          [[ $tag =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo "::error::release tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          mkdir shas
          gh release download "$tag" --repo cratestack/corntchap --pattern 'corntchap-cli-*.tar.gz.sha256' --dir shas
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: render the formula
        if: steps.release.outputs.found == 'true'
        run: |
          set +e
          scripts/render-formula.sh release.json shas Formula/corntchap-cli.rb
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            10) echo "Release is older than the formula; leaving it as is." ;; # never downgrade
            *) echo "::error::render-formula.sh refused the release (exit $rc)"; exit 1 ;;
          esac
      - name: changed?
        id: diff
        run: |
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The formula is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: Formula/corntchap-cli.rb
          if-no-files-found: error
          retention-days: 1
  # the candidate is installed here, before anything is pushed
  test:
    needs: render
    if: needs.render.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      artifact: candidate
  publish:
    needs: [render, test]
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tested formula; the job token is the only credential
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate
          path: candidate
      - name: commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp candidate/corntchap-cli.rb Formula/corntchap-cli.rb
          if git diff --quiet -- Formula; then echo "Nothing to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(grep -oE -m1 'releases/download/v[0-9.]+' Formula/corntchap-cli.rb | sed 's#.*/v##')
          git add Formula/corntchap-cli.rb
          git commit -m "corntchap-cli $version"
          git push origin "HEAD:$DEFAULT_BRANCH"
